
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#243b1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Physics Home Screen</title>

<style>
:root {
    --scale: 1;
    --white: #fff;
    --glass: rgba(255,255,255,.20);
    --border: rgba(255,255,255,.25);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #263f1c;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont,
                 "SF Pro Display", "Helvetica Neue", sans-serif;
    user-select: none;
    -webkit-user-select: none;
}

#phone {
    position: relative;
    width: min(100%, 480px);
    height: 100%;
    height: 100dvh;
    margin: auto;
    overflow: hidden;
    isolation: isolate;
    touch-action: none;
}

#wallpaper {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
}

/* Wallpaper shading */

#shade {
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(
        180deg,
        rgba(0,0,0,.12),
        transparent 25%,
        transparent 65%,
        rgba(0,0,0,.16)
    );
    pointer-events: none;
}

/* STATUS BAR */

#status {
    position: absolute;
    z-index: 20;
    top: max(12px, env(safe-area-inset-top));
    left: 22px;
    right: 22px;
    height: 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 17px;
    font-weight: 700;
    text-shadow: 0 1px 4px #0008;
    pointer-events: none;
}

#statusRight {
    display: flex;
    align-items: center;
    gap: 7px;
}

#status svg {
    display: block;
}

#battery {
    height: 14px;
    width: 27px;
    background: #e6d83c;
    border-radius: 4px;
    color: #111;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

#battery::after {
    content: "";
    position: absolute;
    right: -3px;
    width: 2px;
    height: 6px;
    background: white;
    border-radius: 0 2px 2px 0;
}

/* APP ICONS */

#world {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
}

.app {
    position: absolute;
    width: calc(64px * var(--scale));
    height: calc(64px * var(--scale));
    margin: -32px 0 0 -32px;
    pointer-events: auto;
    touch-action: none;
    cursor: grab;
    will-change: transform;
}

.app:active {
    cursor: grabbing;
}

.icon {
    width: 100%;
    height: 100%;
    border-radius: 23%;
    overflow: hidden;
    box-shadow:
        0 2px 5px rgba(0,0,0,.32),
        inset 0 1px 1px rgba(255,255,255,.12);
    background: #171719;
}

.icon svg {
    width: 100%;
    height: 100%;
    display: block;
}

.label {
    position: absolute;
    top: 100%;
    margin-top: calc(5px * var(--scale));
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: calc(13px * var(--scale));
    font-weight: 600;
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
    pointer-events: none;
}

/* DOCK */

#dock {
    position: absolute;
    z-index: 3;
    left: 2.8%;
    right: 2.8%;
    bottom: max(12px, env(safe-area-inset-bottom));
    height: calc(92px * var(--scale));
    border-radius: calc(34px * var(--scale));
    background: rgba(180,180,187,.78);
    border: 1px solid rgba(255,255,255,.23);
    backdrop-filter: blur(30px) saturate(150%);
    -webkit-backdrop-filter: blur(30px) saturate(150%);
    pointer-events: none;
}

/* SEARCH */

#search {
    position: absolute;
    z-index: 4;
    left: 50%;
    bottom: calc(112px * var(--scale) + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    padding: 8px 17px;
    min-width: 105px;
    border-radius: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,.88);
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    pointer-events: none;
}

/* CONTROLS */

#controls {
    position: absolute;
    z-index: 30;
    top: calc(max(55px, env(safe-area-inset-top) + 35px));
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 8px;
    pointer-events: none;
}

.control {
    pointer-events: auto;
    border: 1px solid var(--border);
    border-radius: 30px;
    padding: 8px 13px;
    background: rgba(0,0,0,.25);
    color: white;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
}

.control:active {
    background: rgba(255,255,255,.3);
}

/* MESSAGE */

#message {
    position: absolute;
    z-index: 40;
    left: 10%;
    right: 10%;
    bottom: calc(125px + env(safe-area-inset-bottom));
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    text-shadow: 0 1px 4px black;
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
}

/* HOME INDICATOR */

#homeIndicator {
    position: absolute;
    z-index: 25;
    bottom: max(5px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    width: 105px;
    height: 4px;
    background: white;
    border-radius: 10px;
    opacity: .85;
    pointer-events: none;
}

</style>
</head>

<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const $ = id => document.getElementById(id);

const phone = $("phone");
const world = $("world");
const canvas = $("wallpaper");
const motionButton = $("motionButton");

let W = 0;
let H = 0;
let S = 1;

let active = false;
let motionEnabled = false;
let permissionGranted = false;

let lastTime = 0;
let drag = null;

let gravity = {x:0,y:0};
let targetGravity = {x:0,y:0};

const clamp = (v,min,max) =>

/* =====================================================

{

    <defs>

          fill="url(#zipblue)"/>

];


/* =====================================================
   CREATE APPLICATIONS
===================================================== */

const bodies = icons.map(icon => {

    const el = document.createElement("div");

    el.className = "app";

    el.innerHTML = `
        <div class="icon">
            <svg viewBox="0 0 64 64">
                ${icon.svg}
            </svg>
        </div>
        ${icon.name ? `<div class="label">${icon.name}</div>` : ""}
    `;

    world.appendChild(el);

    return {
        ...icon,
        el,
        im:el.firstElementChild,

        x:0,
        y:0,
        vx:0,
        vy:0,
        angle:0,
        radius:32*S
    };

});


/* =====================================================
   POSITIONING
===================================================== */

function setScale() {

    W = phone.clientWidth;
    H = phone.clientHeight;

    S = clamp(W / 375,.85,1.2);

    phone.style.setProperty("--scale",S);

    bodies.forEach(b => {
        b.radius = 32*S;
    });

}

function homePositions() {

    bodies.forEach(b => {

        b.x = b.xHome = b.x * W;
        b.y = b.yHome = b.y * H;

        b.vx = 0;
        b.vy = 0;
        b.angle = 0;

    });

}

function layout() {

    setScale();

    bodies.forEach(b => {

        b.x = b.xHome = b.x * W;
        b.y = b.yHome = b.y * H;

        b.vx = 0;
        b.vy = 0;
        b.angle = 0;

    });

    paintWallpaper();

}


/* =====================================================
   PROCEDURAL UNDERWATER WALLPAPER
===================================================== */

function paintWallpaper() {

    const ctx = canvas.getContext("2d");

    const dpr = Math.min(devicePixelRatio || 1,2);

    canvas.width = W*dpr;
    canvas.height = H*dpr;

    ctx.setTransform(dpr,0,0,dpr,0,0);

    // Dark ocean background

    const bg = ctx.createLinearGradient(0,0,W,H);

    bg.addColorStop(0,"#153b28");
    bg.addColorStop(.45,"#183e26");
    bg.addColorStop(1,"#101f15");

    ctx.fillStyle = bg;
    ctx.fillRect(0,0,W,H);

    // Anemones

    let seed = 92827;

    function random() {
        seed = (seed * 16807) % 2147483647;
        return seed / 2147483647;
    }

    const count = Math.ceil(W*H/1800);

    for(let i=0;i<count;i++) {

        const x = random()*W;
        const y = random()*H;

        const radius = (27+random()*27)*S;

        const g = ctx.createRadialGradient(
            x-radius*.2,
            y-radius*.2,
            1,
            x,
            y,
            radius
        );

        g.addColorStop(0,"#628b37");
        g.addColorStop(.4,"#527e34");
        g.addColorStop(.8,"#315b2b");
        g.addColorStop(1,"#18351f");

        ctx.fillStyle = g;

        ctx.beginPath();
        ctx.arc(x,y,radius,0,Math.PI*2);
        ctx.fill();

        // Anemone texture

        for(let j=0;j<75;j++) {

            const a = random()*Math.PI*2;
            const r = random()*radius*.9;

            const px = x+Math.cos(a)*r;
            const py = y+Math.sin(a)*r;

            ctx.strokeStyle = `rgba(165,195,93,${random()*.3})`;
            ctx.lineWidth = .8;

            ctx.beginPath();
            ctx.moveTo(px,py);
            ctx.lineTo(
                px+Math.cos(a)*3*S,
                py+Math.sin(a)*3*S
            );
            ctx.stroke();

        }

        // Center

        ctx.fillStyle = "rgba(50,25,50,.5)";
        ctx.beginPath();
        ctx.arc(x,y,radius*.08,0,Math.PI*2);
        ctx.fill();

    }

    // Clownfish

    function fish(x,y,scale,flip=false) {

        ctx.save();

        ctx.translate(x,y);

        ctx.scale(flip?-scale:scale,scale);

        // Tail

        ctx.fillStyle = "#ed6b12";

        ctx.beginPath();
        ctx.moveTo(65,0);
        ctx.lineTo(115,-43);
        ctx.lineTo(111,0);
        ctx.lineTo(115,43);
        ctx.closePath();
        ctx.fill();

        // Body

        const body = new Path2D();

        body.moveTo(-100,0);
        body.bezierCurveTo(-95,-58,0,-65,65,-30);
        body.bezierCurveTo(100,-15,100,15,65,30);
        body.bezierCurveTo(0,65,-95,58,-100,0);
        body.closePath();

        const orange = ctx.createLinearGradient(0,-60,0,60);

        orange.addColorStop(0,"#ff9b24");
        orange.addColorStop(.5,"#f66a08");
        orange.addColorStop(1,"#d94a08");

        ctx.fillStyle = orange;
        ctx.fill(body);

        // White stripes

        ctx.save();
        ctx.clip(body);

        ctx.fillStyle = "#f2f3e9";

        for(const x of [-55,10,72]) {

            ctx.beginPath();
            ctx.moveTo(x-9,-75);
            ctx.lineTo(x+7,-75);
            ctx.lineTo(x-12,75);
            ctx.lineTo(x-28,75);
            ctx.closePath();
            ctx.fill();

        }

        ctx.restore();

        // Body outline

        ctx.strokeStyle = "rgba(35,15,0,.6)";
        ctx.lineWidth = 2;
        ctx.stroke(body);

        // Eye

        ctx.fillStyle = "#080b0a";
        ctx.beginPath();
        ctx.arc(-76,-10,7,0,Math.PI*2);
        ctx.fill();

        ctx.strokeStyle = "#ffb32d";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(-76,-10,9,0,Math.PI*2);
        ctx.stroke();

        ctx.restore();

    }

    fish(W*.43,H*.45,W*.0017);
    fish(W*.91,H*.56,W*.0017,true);

    // Underwater darkening

    const overlay = ctx.createLinearGradient(0,0,0,H);

    overlay.addColorStop(0,"rgba(0,0,0,.12)");
    overlay.addColorStop(.6,"rgba(0,0,0,0)");
    overlay.addColorStop(1,"rgba(0,0,0,.15)");

    ctx.fillStyle = overlay;
    ctx.fillRect(0,0,W,H);

}


/* =====================================================
   PHYSICS ENGINE
===================================================== */

function physics(dt) {

    const G = 2500*S;

    const friction = Math.exp(-.65*dt);

    const maxSpeed = 3000*S;

    for(const b of bodies) {

        if(drag && drag.b === b) continue;

        b.vx += gravity.x*G*dt;
        b.vy += gravity.y*G*dt;

        b.vx *= friction;
        b.vy *= friction;

        b.vx = clamp(b.vx,-maxSpeed,maxSpeed);
        b.vy = clamp(b.vy,-maxSpeed,maxSpeed);

        b.x += b.vx*dt;
        b.y += b.vy*dt;

        b.angle += b.vx*dt/(b.radius||1)*.45;

        // Screen collisions

        const r = b.radius;

        if(b.x < r) {
            b.x = r;
            b.vx = Math.abs(b.vx)*.55;
        }

        if(b.x > W-r) {
            b.x = W-r;
            b.vx = -Math.abs(b.vx)*.55;
        }

        if(b.y < r) {
            b.y = r;
            b.vy = Math.abs(b.vy)*.55;
        }

        if(b.y > H-r) {
            b.y = H-r;
            b.vy = -Math.abs(b.vy)*.55;
        }

    }

    // App collisions

    for(let i=0;i<bodies.length;i++) {

        for(let j=i+1;j<bodies.length;j++) {

            const a = bodies[i];
            const b = bodies[j];

            const dx = b.x-a.x;
            const dy = b.y-a.y;

            const dist = Math.hypot(dx,dy);

            const minDist = a.radius+b.radius;

            if(dist >= minDist || dist < .001) continue;

            const nx = dx/dist;
            const ny = dy/dist;

            const invA = drag && drag.b===a ? 0 : 1;
            const invB = drag && drag.b===b ? 0 : 1;

            const total = invA+invB;

            if(!total) continue;

            const overlap = minDist-dist;

            a.x -= nx*overlap*invA/total;
            a.y -= ny*overlap*invA/total;

            b.x += nx*overlap*invB/total;
            b.y += ny*overlap*invB/total;

            const relative =
                (b.vx-a.vx)*nx+
                (b.vy-a.vy)*ny;

            if(relative < 0) {

                const impulse = -(1+.65)*relative/total;

                a.vx -= impulse*nx*invA;
                a.vy -= impulse*ny*invA;

                b.vx += impulse*nx*invB;
                b.vy += impulse*ny*invB;

            }

        }

    }

}


/* =====================================================
   RENDER LOOP
===================================================== */

function loop(time) {

    const dt = Math.min(
        (time-lastTime)/1000 || .016,
        .033
    );

    lastTime = time;

    gravity.x += (targetGravity.x-gravity.x)*.18;
    gravity.y += (targetGravity.y-gravity.y)*.18;

    if(active) {

        // Substeps for more stable collisions

        for(let i=0;i<3;i++) {
            physics(dt/3);
        }

    }

    bodies.forEach(b => {

        b.el.style.transform =
            `translate3d(${b.x}px,${b.y}px,0)`;

        b.im.style.transform =
            `rotate(${b.angle}rad)`;

    });

    requestAnimationFrame(loop);

}


/* =====================================================
   IOS MOTION SENSOR
===================================================== */

let lastShake = 0;

function orientationHandler(e) {

    if(e.beta === null || e.gamma === null) return;

    let beta = e.beta*Math.PI/180;
    let gamma = e.gamma*Math.PI/180;

    let x = Math.sin(gamma)*Math.cos(beta);
    let y = Math.sin(beta);

    // Account for screen rotation

    const angle =
        screen.orientation?.angle ??
        window.orientation ??
        0;

    if(angle === 90) {
        [x,y] = [y,-x];
    } else if(angle === 270 || angle === -90) {
        [x,y] = [-y,x];
    } else if(angle === 180) {
        x = -x;
        y = -y;
    }

    targetGravity.x = clamp(x,-1,1);
    targetGravity.y = clamp(y,-1,1);

}

function motionHandler(e) {

    if(!active) return;

    const a = e.accelerationIncludingGravity;

    if(!a || a.x === null) return;

    const now = performance.now();

    // Shake detection

    const strength = Math.hypot(a.x,a.y,a.z||0);

    if(strength > 23 && now-lastShake > 600) {

        lastShake = now;

        bodies.forEach(b => {

            b.vx += (Math.random()-.5)*1000*S;
            b.vy += (Math.random()-.5)*1000*S;

        });

        showMessage("Shake detected!");

    }

}

async function enableMotion() {

    if(active && permissionGranted) {

        active = false;
        motionEnabled = false;

        window.removeEventListener(
            "deviceorientation",
            orientationHandler
        );

        window.removeEventListener(
            "devicemotion",
            motionHandler
        );

        targetGravity = {x:0,y:0};

        motionButton.textContent = "Enable Motion";

        showMessage("Motion disabled");

        return;
    }

    try {

        let granted = true;

        if(
            typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function"
        ) {

            granted =
                await DeviceOrientationEvent.requestPermission()
                === "granted";

        }

        if(!granted) {

            showMessage("Motion permission denied. Check Safari settings.");
            return;

        }

        window.addEventListener(
            "deviceorientation",
            orientationHandler
        );

        // Acceleration is optional; orientation provides gravity.

        try {

            if(
                typeof DeviceMotionEvent !== "undefined" &&
                typeof DeviceMotionEvent.requestPermission === "function"
            ) {

                const motionResult =
                    await DeviceMotionEvent.requestPermission();

                if(motionResult === "granted") {

                    window.addEventListener(
                        "devicemotion",
                        motionHandler
                    );

                }

            } else {

                window.addEventListener(
                    "devicemotion",
                    motionHandler
                );

            }

        } catch(error) {

            console.log("Acceleration unavailable:",error);

        }

        active = true;
        motionEnabled = true;
        permissionGranted = true;

        motionButton.textContent = "Disable Motion";

        showMessage("Motion enabled! Tilt your iPhone.");

    } catch(error) {

        showMessage(
            "Motion unavailable. Open this page in Safari using HTTPS."
        );

        console.error(error);

    }

}


/* =====================================================
   DRAG AND THROW
===================================================== */

function getPointer(e) {

    const rect = phone.getBoundingClientRect();

    return {
        x:e.clientX-rect.left,
        y:e.clientY-rect.top
    };

}

phone.addEventListener("pointerdown",e => {

    if(e.target.closest("button")) return;

    const p = getPointer(e);

    let best = null;
    let distance = Infinity;

    for(const b of bodies) {

        const d = Math.hypot(
            b.x-p.x,
            b.y-p.y
        );

        if(d < b.radius*1.5 && d < distance) {

            best = b;
            distance = d;

        }

    }

    if(!best) return;

    drag = {
        b:best,
        id:e.pointerId,
        dx:best.x-p.x,
        dy:best.y-p.y,
        lastX:best.x,
        lastY:best.y,
        lastTime:performance.now()
    };

    best.vx = 0;
    best.vy = 0;

    active = true;

    phone.setPointerCapture(e.pointerId);

});

phone.addEventListener("pointermove",e => {

    if(!drag || drag.id !== e.pointerId) return;

    const p = getPointer(e);
    const b = drag.b;

    const now = performance.now();

    const dt = Math.max(
        .008,
        (now-drag.lastTime)/1000
    );

    const nx = clamp(
        p.x+drag.dx,
        b.radius,
        W-b.radius
    );

    const ny = clamp(
        p.y+drag.dy,
        b.radius,
        H-b.radius
    );

    b.vx = (nx-drag.lastX)/dt;
    b.vy = (ny-drag.lastY)/dt;

    b.x = nx;
    b.y = ny;

    drag.lastX = nx;
    drag.lastY = ny;
    drag.lastTime = now;

});

function endDrag(e) {

    if(!drag || drag.id !== e.pointerId) return;

    const b = drag.b;

    b.vx = clamp(b.vx,-3000*S,3000*S);
    b.vy = clamp(b.vy,-3000*S,3000*S);

    drag = null;

}

phone.addEventListener("pointerup",endDrag);
phone.addEventListener("pointercancel",endDrag);


/* =====================================================
   RESET
===================================================== */

function reset() {

    drag = null;

    bodies.forEach(b => {

        b.x = b.xHome;
        b.y = b.yHome;

        b.vx = 0;
        b.vy = 0;
        b.angle = 0;

    });

    active = false;

    targetGravity = {x:0,y:0};
    gravity = {x:0,y:0};

    motionButton.textContent =
        permissionGranted ? "Enable Motion" : "Enable Motion";

    showMessage("Home Screen restored");

}


/* =====================================================
   MESSAGES
===================================================== */

let messageTimer;

function showMessage(text) {

    const el = $("message");

    el.textContent = text;
    el.style.opacity = 1;

    clearTimeout(messageTimer);

    messageTimer = setTimeout(() => {

        el.style.opacity = 0;

    },3000);

}


/* =====================================================
   CLOCK
===================================================== */

function updateClock() {

    $("clock").textContent =
        new Date().toLocaleTimeString("fr-FR",{
            hour:"2-digit",
            minute:"2-digit"
        });

}


/* =====================================================
   BUTTONS
===================================================== */

motionButton.addEventListener(
    "click",
    enableMotion
);

$("resetButton").addEventListener(
    "click",
    reset
);


/* =====================================================
   INITIALIZATION
===================================================== */

function initialize() {

    layout();

    updateClock();

    showMessage(
        "Enable Motion to tilt your iPhone. Drag icons to play!"
    );

}

window.addEventListener("resize",layout);

window.addEventListener("orientationchange",() => {
    setTimeout(layout,250);
});

initialize();

setInterval(updateClock,10000);

requestAnimationFrame(loop);

</script>
